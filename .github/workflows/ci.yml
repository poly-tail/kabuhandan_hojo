name: ci

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node for dashboard event tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev,browser]

      - name: Install Chromium for isolated UI checks
        run: python -m playwright install --with-deps chromium

      - name: Compile sources
        run: python -m compileall -q app src scripts

      - name: Check current pointers
        run: python scripts/sync_current_files.py --check

      - name: Run tests
        run: python -m pytest

      - name: Run dashboard event sequences
        run: node tests/js/stock_ai_state.test.cjs

      - name: Run dashboard snapshot rendering tests
        run: node tests/js/stock_ai_snapshot.test.cjs

      - name: Check dashboard in Chromium with synthetic APIs
        run: python scripts/check_stock_ai_browser.py

