services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kabuhandan_api
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql+psycopg://kabuhandan:kabuhandan@db:5432/kabuhandan
      POSTGRES_USER: kabuhandan
      POSTGRES_PASSWORD: kabuhandan
      POSTGRES_DB: kabuhandan
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:16-alpine
    container_name: kabuhandan_db
    environment:
      POSTGRES_DB: kabuhandan
      POSTGRES_USER: kabuhandan
      POSTGRES_PASSWORD: kabuhandan
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kabuhandan -d kabuhandan"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
